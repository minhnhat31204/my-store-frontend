<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVORA - KHÔNG CÓ MÃ NGUỒN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f87171;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 28px;
      padding: 48px 32px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 50px rgba(239, 68, 68, 0.15);
      backdrop-filter: blur(12px);
    }
    .icon-box {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 26px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.25);
    }
    .icon-box svg {
      width: 44px;
      height: 44px;
      color: #ef4444;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    p {
      font-size: 15px;
      line-height: 1.65;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 10px 20px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #38bdf8;
      margin-bottom: 28px;
    }
    .btn-return {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
    }
    .btn-return:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }
    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #475569;
    }
  </style>
  <script>
    function checkInspectClosed() {
      var isDesktop = /Windows|Macintosh|Linux/i.test(navigator.userAgent);
      var isNotFullscreen = !document.fullscreenElement;
      var isResponsiveMode = isDesktop && isNotFullscreen && (window.outerWidth === window.innerWidth) && (window.outerHeight === window.innerHeight) && (window.innerWidth < screen.availWidth - 50);
      var wDiff = window.outerWidth - window.innerWidth;
      var hDiff = window.outerHeight - window.innerHeight;
      var isDocked = (wDiff > 160 || hDiff > 160);

      // Chỉ trở về trang cũ khi DevTools (cả Docked và Responsive) đã đóng hoàn toàn
      if (!isResponsiveMode && !isDocked) {
        var returnUrl = sessionStorage.getItem('devora_return_url') || '/';
        window.location.replace(returnUrl);
      }
    }
    window.addEventListener('resize', checkInspectClosed);
    setInterval(checkInspectClosed, 600);

    try {
      console.clear();
      console.log('%c🔒 KHÔNG CÓ MÃ NGUỒN\\n\\nMã nguồn trang web đã được bảo vệ và ẩn hoàn toàn.', 'font-size: 24px; font-weight: 900; color: #ef4444;');
    } catch(e){}
  </script>
</head>
<body>
  <div class="card">
    <div class="icon-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Không Có Mã Nguồn</h1>
    <p>
      Mã nguồn trang web đã được mã hóa và bảo vệ toàn diện.<br/>
      Toàn bộ mã JavaScript, cấu trúc DOM và dữ liệu nội bộ đã bị xóa hoàn toàn khỏi công cụ Kiểm tra (Inspect / DevTools).
    </p>
    <div class="badge">
      [TRẠNG THÁI: TOÀN BỘ MÃ NGUỒN ĐÃ BỊ ẨN]
    </div>
    <div>
      <button class="btn-return" onclick="window.location.replace(sessionStorage.getItem('devora_return_url') || '/')">
        Đóng Inspect và bấm vào đây để tiếp tục
      </button>
    </div>
    <div class="footer-note">
      DEVORA Security System · Chế độ bảo vệ an toàn thông tin
    </div>
  </div>
</body>
</html>
